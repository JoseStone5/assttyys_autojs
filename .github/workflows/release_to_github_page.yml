name: release_to_github_page

on:
  push:
    branches:
      - master
      - zz_dev
      - kk_dev
      - hm_dev
      - v66_dev
      - Kong_dev
      - ui_refactor
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm install
 
      - name: Build
        run: npm run build2

      - name: Pack release files
        run: node pack_dev_release.js ${{ env.BRANCH_NAME }}

      - name: Deploy to JoseStone5.github.io
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 1. 配置 Git 身份
          git config --global user.name "GitHub Actions-Bot"
          git config --global user.email "actions@github.com"
          
          # 2. 使用 PAT 克隆目标博客仓库
          git clone https://${GH_PAT}@github.com/JoseStone5/JoseStone5.github.io.git target_blog
          cd target_blog
          
          # 3. 创建目标子目录
          mkdir -p assttyys_test
          
          # 4. 清理 assttyys_test 目录中的旧文件
          rm -rf assttyys_test/*
          
          # 5. 只将对应分支文件夹（例如 dev_release/JoseStone5-patch-1/）内部的所有文件复制过来
          cp -r ../dev_release/${{ env.BRANCH_NAME }}/* assttyys_test/
          
          # 6. 提交并推送到 JoseStone5.github.io 的 main 分支
          git add .
          git commit -m "Auto update assttyys_test from assttyys_autojs (${{ env.BRANCH_NAME }})" || echo "No changes to commit"
          git push origin main
