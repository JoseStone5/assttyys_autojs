name: release_to_github_page

on:
  push:
    branches:
      - master
      - zz_dev
      - kk_dev
      - hm_dev
      - v66_dev
      - Kong_dev
      - ui_refactor
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Setup Git Credentials for Private Repos
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 1. 配置 Git 凭证存储，将 PAT 写入临时凭证文件
          git config --global credential.helper store
          echo "https://x-access-token:${{ env.GH_PAT }}@github.com" >> ~/.git-credentials
          
          # 2. 将所有的 SSH 形式无缝重定向为 HTTPS 形式
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
      - run: npm install
 
      - name: Build
        run: npm run build2

      - name: Pack release files
        run: node pack_dev_release.js ${{ env.BRANCH_NAME }}

      - name: Deploy to JoseStone5.github.io
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 1. 配置 Git 身份
          git config --global user.name "GitHub Actions-Bot"
          git config --global user.email "actions@github.com"
          
          # 2. 使用 PAT 克隆目标博客仓库
          git clone https://${GH_PAT}@github.com/JoseStone5/JoseStone5.github.io.git target_blog
          cd target_blog
          
          # 3. 确保目标仓库存在 assttyys_autojs 目录
          mkdir -p assttyys_autojs
          
          # 4. 删除目标仓库中旧的同名分支文件夹（防止文件残留或冲突）
          rm -rf assttyys_autojs/${{ env.BRANCH_NAME }}
          
          # 5. 直接把 dev_release 下的整个分支文件夹复制到 assttyys_autojs/ 目录下
          cp -r ../dev_release/${{ env.BRANCH_NAME }} assttyys_autojs/
          
          # 6. 提交并推送到 JoseStone5.github.io 的 main 分支
          git add .
          git commit -m "Auto update assttyys_autojs/${{ env.BRANCH_NAME }} from assttyys_autojs" || echo "No changes to commit"
          git push origin main
